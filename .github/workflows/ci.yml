# 为什么今天才加 CI
#
# 2026-10-06, V0.9.0 的三个 P0 全部是"测试全绿但用户会崩":
#
#   - 零数据打开「周期化」页 → TypeError → 整页白屏
#   - /api/recommendations/today → 500
#   - ACWR 从来没进过 AI prompt (对所有人静默失效)
#
# 282 个测试全绿, 变异测试也没覆盖到, 因为**根本没人在 push 前跑全量**。
# 更根本的问题是: 契约变更跨了后端/前端/类型三层, 没有任何机制
# 在合入前发现"后端返回 null, 前端还在当对象用"。
#
# 所以 CI 的第一职责不是"跑测试", 是**卡住契约不一致**。
name: CI

on:
  push:
    branches: [main, master, "v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 注意: 不加 --lf / 不吞退出码。红了就是红了。
      - name: 全量测试
        run: pytest tests/ -q --timeout=300

  frontend:
    name: 前端 (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: 安装
        run: pnpm install --frozen-lockfile

      # 🔴 这一步是今天三个 P0 的直接防线:
      # 零数据时后端返回 dimensions: null, 而前端类型写的是必填非空 ——
      # 于是 tsc 从不提醒。类型一改成 | null, 立刻冒出 4 个错误,
      # 精确指向我漏掉的每一处。
      #
      # **类型不是注释, 是编译器契约。** 所以 typecheck 必须是独立门禁,
      # 不能被 build 顺带跑。
      - name: 类型检查
        run: pnpm exec tsc --noEmit

      - name: 类型检查 (测试代码)
        run: pnpm run typecheck:test

      - name: 单元测试
        run: pnpm exec vitest run

      - name: 生产构建
        run: pnpm run build

  # 契约一致性: 后端 OpenAPI 声明的形状 vs 前端 TypeScript 类型
  #
  # 今天三个 P0 里有两个(P0-1 周期化 null、P0-3 阶段处方 0→None)是
  # **后端改了契约而前端类型没跟上**。单靠 tsc 抓不到跨语言的情况,
  # 所以这里单独跑一个检查。
  contract:
    name: 契约检查 (后端 None 值不出现在必填字段)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 检查关键端点的零数据形状
        run: |
          python tools/check_contract_shapes.py
