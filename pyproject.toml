[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cycling-coach"
version = "0.7.5.3"
description = "公路自行车 AI 教练 — 本地优先,把 FIT 数据自动解读成可执行训练建议"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "lixvanran" },
]
keywords = ["cycling", "coach", "fit", "power-meter", "training"]

# runtime deps
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.12",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "sqlalchemy>=2.0",
    "fitparse>=1.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    # V0.7.3: PDF 周报
    "reportlab>=4.0",
    # V0.7.4: FIT 课程导出 (Garmin/Wahoo)
    "fit-tool>=0.9.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",  # linter
    "mypy>=1.10",  # type check
]
ai-rag = [
    "jieba>=0.42",  # 简单中文分词(RAG 检索用,V0.3+)
]
desktop = [
    # Tauri 依赖在 apps/desktop/,Python 侧无依赖
]
all = [
    "cycling-coach[dev,ai-rag,desktop]",
]

# 单一根包(monorepo 单包策略)
[tool.setuptools.packages.find]
where = ["."]
include = ["cycling_coach.*"]
exclude = ["apps*", "tests*", "tools*", "docs*", "scripts*", "assets*", "workspace*"]

# ============== Tool config ==============

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["apps", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = [
    "E501",  # line too long(Python 风格允许略长)
    "B008",  # do not perform function calls in argument defaults(我们用 FastAPI Depends)
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["apps", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
