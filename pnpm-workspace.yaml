# pnpm workspace 配置
#
# 关键:同时声明 packages 和 build 白名单,跨 pnpm 9/10/11 全兼容
# - packages 字段让 pnpm 11 严格模式能识别 workspace 项目
# - allowBuilds / onlyBuiltDependencies 显式 allow postinstall 脚本
#   (esbuild 需要下载 platform binary)
#
# 详见:https://pnpm.io/settings#onlybuiltdependencies
#
# 注意:pnpm 11 引入了新写法 allowBuilds(map 形式),
# 旧的 onlyBuiltDependencies(list 形式)仍然支持但有时会出 schema 错误,
# 同时写两个最稳。

packages:
  - 'apps/*'

# pnpm 11+ 新写法(更细粒度,推荐)
allowBuilds:
  esbuild: true
  '@esbuild/win32-x64': true
  '@esbuild/darwin-x64': true
  '@esbuild/darwin-arm64': true
  '@esbuild/linux-x64': true
  '@esbuild/linux-arm64': true
  '@esbuild/linux-ia32': true
  '@esbuild/linux-ppc64': true
  '@esbuild/freebsd-x64': true
  '@esbuild/freebsd-arm64': true
  '@esbuild/openbsd-x64': true
  '@esbuild/openbsd-arm64': true
  '@esbuild/netbsd-x64': true
  '@esbuild/sunos-x64': true
  '@esbuild/android-x64': true
  '@esbuild/android-arm64': true
  '@esbuild/android-arm': true
  '@esbuild/aix-ppc64': true
  '@swc/core': true
  core-js: true
  better-sqlite3: true
  sharp: true

# 兼容老写法(pnpm 9/10 仍用 list 形式,以及 11 的回退)
onlyBuiltDependencies:
  - esbuild
  - '@swc/core'
  - core-js
  - better-sqlite3
  - sharp
