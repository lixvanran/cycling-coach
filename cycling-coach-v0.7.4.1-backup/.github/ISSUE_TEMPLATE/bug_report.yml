name: Bug Report / 错误报告
description: Report a bug to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: version
    attributes:
      label: Version / 版本
      options:
        - V0.6.1 (latest)
        - V0.6.0
        - V0.5.x
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 发生了什么?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce / 复现步骤
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / 操作系统
    validations:
      required: true
